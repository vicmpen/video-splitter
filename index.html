<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Video Splitter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .file-selection, .output-selection, .video-preview-container, .segments-container, .results {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 5px;
    }
    button {
      padding: 8px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .secondary-button {
      background-color: #2196F3;
    }
    .secondary-button:hover {
      background-color: #0b7dda;
    }
    .segment {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 4px;
    }
    .segment input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .segment button {
      background-color: #f44336;
    }
    .segment button:hover {
      background-color: #d32f2f;
    }
    #process-button {
      font-size: 16px;
      padding: 10px 20px;
    }
    .results {
      max-height: 600px;
      overflow-y: auto;
    }
    .result-item {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 4px;
    }
    .success {
      background-color: #e8f5e9;
    }
    .error {
      background-color: #ffebee;
    }
    .preview-container {
      margin-top: 10px;
    }
    .video-preview {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-path {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
      word-break: break-all;
    }
    .preview-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }
    .current-time {
      font-family: monospace;
      font-size: 14px;
      background-color: #f0f0f0;
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    #input-video {
      width: 100%;
      max-width: 100%;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    /* Timeline styles */
    .timeline-container {
      margin-top: 10px;
      position: relative;
    }
    .timeline {
      width: 100%;
      height: 40px;
      background-color: #f0f0f0;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .timeline-progress {
      height: 100%;
      background-color: rgba(33, 150, 243, 0.3);
      position: absolute;
      left: 0;
      top: 0;
    }
    .timeline-marker {
      position: absolute;
      width: 2px;
      height: 100%;
      background-color: #ff0000;
      top: 0;
      z-index: 2;
    }
    .timeline-segments {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .timeline-segment {
      position: absolute;
      height: 100%;
      background-color: rgba(76, 175, 80, 0.5);
      border: 1px solid rgba(76, 175, 80, 0.8);
      box-sizing: border-box;
    }
    .timeline-timestamps {
      display: flex;
      justify-content: space-between;
      padding: 0 5px;
      margin-top: 5px;
      font-size: 12px;
      color: #666;
    }
    .timeline-timestamp {
      position: absolute;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 11px;
    }
    .timeline-timestamp-marker {
      position: absolute;
      width: 1px;
      height: 10px;
      background-color: #999;
      bottom: 0;
      transform: translateX(-50%);
    }
    .zoom-controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
      gap: 5px;
    }
    .zoom-controls button {
      padding: 3px 8px;
      font-size: 12px;
    }
    .timeline-highlight {
      position: absolute;
      height: 100%;
      background-color: rgba(255, 193, 7, 0.4);
      border: 1px dashed #FFC107;
      box-sizing: border-box;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video Splitter</h1>
    
    <div class="file-selection">
      <h2>Step 1: Select Video File</h2>
      <button id="select-file-button">Select MP4 Video</button>
      <p id="selected-file">No file selected</p>
      <p id="video-duration"></p>
    </div>
    
    <div class="video-preview-container">
      <h2>Video Preview</h2>
      <video id="input-video" controls></video>
      <div class="timeline-container">
        <div class="timeline" id="timeline">
          <div class="timeline-progress" id="timeline-progress"></div>
          <div class="timeline-marker" id="timeline-marker"></div>
          <div class="timeline-segments" id="timeline-segments"></div>
          <!-- <div class="timeline-highlight" id="timeline-highlight"></div> -->
          <!-- <div class="timeline-timestamps" id="timeline-timestamps"></div> -->
        </div>
 
      </div>
      <div class="preview-controls">
        <div class="current-time" id="current-time">00:00:00.000</div>
        <div class="current-time" id="current-second">0</div>

        <button id="add-from-preview-button" disabled>Add Segment at Current Time</button>
      </div>
    </div>
    
    <div class="output-selection">
      <h2>Step 2: Select Output Folder</h2>
      <button id="select-output-button">Select Destination Folder</button>
      <p id="selected-output">No folder selected</p>
    </div>
    
    <div class="segments-container">
      <h2>Step 3: Define Video Segments</h2>
      <div id="segments"></div>
      <button id="add-segment-button">Add Segment</button>
    </div>
    
    <button id="process-button" disabled>Process Video</button>
    
    <div class="results">
      <h2>Results</h2>
      <div id="results-container"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
